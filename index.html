<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover open-source projects, find issues that match your skills, and make your next contribution."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ContribHub – Find your next open-source contribution</title>
    <script>
      // Applied before first paint so dark-mode users never see a light flash.
      try {
        var stored = localStorage.getItem('contribhub:theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
