<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start -->
    <title>ContribHub: Find Good First Issues &amp; Open-Source Projects for Beginners</title>
    <meta name="description" content="Find good first issues and beginner-friendly open-source projects on GitHub. Filter issues by language and label, follow a step-by-step guide, and make your first contribution. Free, no sign-up." />
    <link rel="canonical" href="https://contribhub.online/" />
    <!-- seo:end -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#111312" />
    <meta name="author" content="ContribHub" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <script>
      // Applied before first paint so dark-mode users never see a light flash.
      try {
        var stored = localStorage.getItem('contribhub:theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>ContribHub: find good first issues and open-source projects</h1>
      <p>ContribHub helps developers discover GitHub projects and beginner-friendly issues. It needs JavaScript to load live GitHub data.</p>
      <ul>
        <li><a href="/explore">Explore open-source projects</a></li>
        <li><a href="/issues">Find good first issues</a></li>
        <li><a href="/trending">Trending GitHub projects</a></li>
        <li><a href="/guide">How to contribute to open source</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
